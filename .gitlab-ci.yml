# .gitlab-ci.yml
#
# Modelo de branches deste projeto (deliberadamente simples, não é
# GitFlow completo — não há release/hotfix branches, o que seria
# overhead desproporcional para um projeto deste porte):
#
#   feature branches ──MR──► develop ──MR──► main
#      (trabalho acontece)   (integração,     (só deploy —
#                             default branch    nada mais)
#                             do repositório)
#
# Por isso as regras abaixo usam nomes de branch explícitos
# ("develop", "main"), não $CI_DEFAULT_BRANCH — uma vez que
# "branch padrão do repositório" (develop) e "branch que decide o
# deploy" (main) passam a ser conceitos diferentes, uma variável só não
# dá conta dos dois.
#
# Pipeline evolutivo: lint + test + validação de Dockerfile rodam SEMPRE
# em MR e em push pra develop/main, e não dependem de nenhuma credencial.
# Os estágios de push/deploy na GCP só entram no pipeline quando as
# variáveis de CI/CD abaixo estiverem configuradas E o commit for em
# main especificamente — até lá, o pipeline fica verde só com
# lint+test+build_check.
#
# `uv sync --locked` (não --frozen): --frozen instala o que estiver no
# uv.lock SEM checar se bate com pyproject.toml -- se o lock commitado
# estiver desatualizado (ex: uma dependência de dev foi adicionada no
# pyproject.toml mas o uv.lock não foi regenerado), --frozen instala
# silenciosamente incompleto, sem erro nenhum. Foi exatamente assim que
# um `ruff check` falhou em CI com "No such file or directory" — o lock
# commitado não tinha o ruff, e --frozen nunca reclamou disso. --locked
# falha alto e claro nesse cenário ("lockfile não está atualizado"), o
# que é um erro muito mais fácil de diagnosticar que "comando não
# encontrado" no meio de um job de lint.
#
# Variáveis de CI/CD esperadas (configurar quando for ativar o deploy):
#   GCP_PROJECT_ID       - ID do projeto GCP de destino
#   GCP_PROJECT_NUMBER   - número do projeto (necessário pro WIF)
#   GCP_REGION           - ex: us-central1
#   AR_REGION            - região do Artifact Registry, ex: us-central1
#   AR_REPOSITORY        - nome do repositório Docker no Artifact Registry
#   WIF_POOL_ID          - ID do Workload Identity Pool
#   WIF_PROVIDER_ID      - ID do Provider dentro do pool
#   WIF_SERVICE_ACCOUNT  - email da service account impersonada
#   CLOUD_SQL_CONNECTION_NAME - PROJETO:REGIAO:INSTANCIA (sai de
#                               `terraform output`), usada por
#                               deploy_sdr_bot_api pra montar
#                               --add-cloudsql-instances
#
# Todas essas variáveis (e a infra que elas apontam: Artifact Registry, WIF,
# Secret Manager, Cloud SQL) são provisionadas via Terraform -- ver
# terraform/ e README.md > "Deploy via Terraform". `terraform output` gera
# exatamente os valores a colar aqui.
#
# Autenticação: usamos Workload Identity Federation (OIDC), não uma chave
# JSON de service account estática — os tokens são de curta duração e
# emitidos por job, o que elimina o risco de uma chave de longa duração
# vazar de uma variável de CI. Ver README.md > "Configurando deploy na GCP"
# para o setup do lado GCP (feito uma vez, fora do pipeline).
# Referência: https://docs.gitlab.com/ci/cloud_services/google_cloud/

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

stages:
  - lint
  - test
  - build
  - deploy

variables:
  # docker:27-dind roda como container-serviço irmão (hostname "docker"),
  # não no mesmo container do job -- sem isso o CLI cai no default
  # unix:///var/run/docker.sock, que não existe aqui, e falha com
  # "Cannot connect to the Docker daemon". TLS desabilitado (setup padrão
  # documentado pelo GitLab pra dind) porque não há volume de certs
  # compartilhado entre job e serviço.
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  # Dockerfiles usam --mount=type=cache/bind (sintaxe BuildKit-only) --
  # sem isso o CLI cai no builder legado e falha com "the --mount option
  # requires BuildKit".
  DOCKER_BUILDKIT: "1"
  API_IMAGE_TAG: "${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/sdr-bot-api:${CI_COMMIT_SHORT_SHA}"
  PROXY_IMAGE_TAG: "${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/litellm-proxy:${CI_COMMIT_SHORT_SHA}"
  TELEGRAM_IMAGE_TAG: "${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/telegram-service:${CI_COMMIT_SHORT_SHA}"
  # Container Scanning (template incluído acima) escaneia por padrão
  # $CI_APPLICATION_REPOSITORY:$CI_APPLICATION_TAG, que não bate com as
  # tags reais no Artifact Registry -- aponta explicitamente pra imagem
  # da API, que é a que expõe superfície de rede maior.
  CS_IMAGE: "${API_IMAGE_TAG}"

# Bloco reutilizado pelos jobs que precisam autenticar na GCP via WIF.
# Troca o ID token do GitLab por uma credencial federada de curta duração,
# via impersonation da service account configurada.
.gcp_auth: &gcp_auth
  - echo "$GCP_ID_TOKEN" > "${CI_PROJECT_DIR}/gcp_id_token"
  - >
    gcloud iam workload-identity-pools create-cred-config
    "projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL_ID}/providers/${WIF_PROVIDER_ID}"
    --service-account="${WIF_SERVICE_ACCOUNT}"
    --service-account-token-lifetime-seconds=600
    --output-file="${CI_PROJECT_DIR}/gcp_cred_config.json"
    --credential-source-file="${CI_PROJECT_DIR}/gcp_id_token"
  - export GOOGLE_APPLICATION_CREDENTIALS="${CI_PROJECT_DIR}/gcp_cred_config.json"
  - gcloud auth login --cred-file="${GOOGLE_APPLICATION_CREDENTIALS}" --quiet
  - gcloud config set project "${GCP_PROJECT_ID}" --quiet

# ---------------------------------------------------------------------
# Sempre rodam (não precisam de nenhuma credencial de GCP)
# ---------------------------------------------------------------------

lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - uv sync --locked
    - uv run ruff check app tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - uv sync --locked
    - uv run pytest tests/ -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
  # Nota: os testes atuais (smoke test da topologia de agentes + /health
  # da API) não fazem nenhuma chamada real de LLM nem precisam de
  # OPENROUTER_API_KEY — seguro rodar em qualquer pipeline, inclusive de
  # merge request de contribuidor externo.
  # A Parte 6 (golden eval set / LLM-as-judge) vai virar um job separado,
  # explicitamente marcado como "consome API de verdade e custa dinheiro",
  # não misturado com este smoke test.

docker_build_check:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    # Limpa qualquer imagem/camada residual de jobs anteriores no MESMO
    # runner antes de buildar -- não resolve a causa raiz de imagem
    # pesada (isso é o fix em pyproject.toml: torch CPU-only em vez do
    # build com CUDA), mas é uma rede de segurança independente,
    # incondicional, útil mesmo que outra dependência volte a inchar a
    # imagem no futuro.
    - docker system prune -af || true
    - docker build -t sdr-bot-api:ci-check .
    - docker build -t litellm-proxy:ci-check ./litellm_proxy
    - docker build -t telegram-service:ci-check ./telegram_service
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
  # Roda SEMPRE, mesmo sem GCP configurado — só valida que os Dockerfiles
  # buildam de verdade. Pega Dockerfile quebrado antes de qualquer
  # tentativa de deploy, sem precisar de nenhuma credencial de nuvem.

# ---------------------------------------------------------------------
# Só entram no pipeline quando GCP_PROJECT_ID estiver configurado
# ---------------------------------------------------------------------

build_and_push:
  stage: build
  image: google/cloud-sdk:slim
  services:
    - docker:27-dind
  id_tokens:
    GCP_ID_TOKEN:
      aud: "https://iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL_ID}/providers/${WIF_PROVIDER_ID}"
  before_script:
    # google/cloud-sdk:slim traz gcloud mas não o binário docker -- só o
    # daemon dind (serviço) está disponível, não o CLI pra falar com ele.
    # docker.io sozinho não basta: nesta base Debian esse pacote só traz
    # dockerd/docker-proxy/docker-init (confirmado via `dpkg -L docker.io`
    # rodando a própria imagem google/cloud-sdk:slim) -- o binário
    # `docker` em si está no pacote docker-cli, separado. E a partir do
    # docker-cli 23+, `docker build` é só um alias pra `docker buildx
    # build` -- sem o plugin docker-buildx instalado, DOCKER_BUILDKIT=1
    # não basta (confirmado: falha com "buildx component is missing").
    - apt-get update && apt-get install -y --no-install-recommends docker-cli docker-buildx
    - *gcp_auth
    - gcloud auth configure-docker "${AR_REGION}-docker.pkg.dev" --quiet
  script:
    - docker build -t "${API_IMAGE_TAG}" .
    - docker push "${API_IMAGE_TAG}"
    - docker build -t "${PROXY_IMAGE_TAG}" ./litellm_proxy
    - docker push "${PROXY_IMAGE_TAG}"
    - docker build -t "${TELEGRAM_IMAGE_TAG}" ./telegram_service
    - docker push "${TELEGRAM_IMAGE_TAG}"
  rules:
    - if: '$GCP_PROJECT_ID && $CI_COMMIT_BRANCH == "main"'

deploy_litellm_proxy:
  stage: deploy
  image: google/cloud-sdk:slim
  id_tokens:
    GCP_ID_TOKEN:
      aud: "https://iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL_ID}/providers/${WIF_PROVIDER_ID}"
  before_script:
    - *gcp_auth
  script:
    # NOTA de segurança (deliberadamente simplificado nesta fase):
    # --allow-unauthenticated aqui porque a autenticação de fato é o
    # LITELLM_PROXY_KEY validado dentro da aplicação (general_settings.
    # master_key), não IAM do Cloud Run. O endurecimento correto é usar
    # --no-allow-unauthenticated + conceder roles/run.invoker só para a
    # service account do sdr-bot-api, com o cliente anexando um ID token
    # do Google na chamada — isso fica como TODO de hardening, junto com
    # os guardrails da Parte 3.
    - >
      gcloud run deploy litellm-proxy
      --image="${PROXY_IMAGE_TAG}"
      --region="${GCP_REGION}"
      --platform=managed
      --port=4000
      --allow-unauthenticated
      --set-secrets="OPENROUTER_API_KEY=openrouter-api-key:latest,LITELLM_PROXY_KEY=litellm-proxy-key:latest"
  environment:
    name: production/litellm-proxy
  needs: ["build_and_push"]
  rules:
    - if: '$GCP_PROJECT_ID && $CI_COMMIT_BRANCH == "main"'
      when: manual

deploy_sdr_bot_api:
  stage: deploy
  image: google/cloud-sdk:slim
  id_tokens:
    GCP_ID_TOKEN:
      aud: "https://iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL_ID}/providers/${WIF_PROVIDER_ID}"
  before_script:
    - *gcp_auth
  script:
    - >
      PROXY_URL=$(gcloud run services describe litellm-proxy
      --region="${GCP_REGION}" --format='value(status.url)')
    - >
      gcloud run deploy sdr-bot-api
      --image="${API_IMAGE_TAG}"
      --region="${GCP_REGION}"
      --platform=managed
      --port=8080
      --allow-unauthenticated
      --service-account="sdr-bot-api-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
      --add-cloudsql-instances="${CLOUD_SQL_CONNECTION_NAME}"
      --set-env-vars="LITELLM_PROXY_URL=${PROXY_URL},SDR_APP_NAME=sdr-bot"
      --set-secrets="LITELLM_PROXY_KEY=litellm-proxy-key:latest,SESSION_DB_URL=session-db-url:latest"
  environment:
    name: production/sdr-bot-api
  needs: ["deploy_litellm_proxy"]
  rules:
    - if: '$GCP_PROJECT_ID && $CI_COMMIT_BRANCH == "main"'
      when: manual

deploy_telegram_service:
  stage: deploy
  image: google/cloud-sdk:slim
  id_tokens:
    GCP_ID_TOKEN:
      aud: "https://iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL_ID}/providers/${WIF_PROVIDER_ID}"
  before_script:
    - *gcp_auth
  script:
    - >
      SDR_BOT_API_URL=$(gcloud run services describe sdr-bot-api
      --region="${GCP_REGION}" --format='value(status.url)')
    - >
      gcloud run deploy telegram-service
      --image="${TELEGRAM_IMAGE_TAG}"
      --region="${GCP_REGION}"
      --platform=managed
      --port=8200
      --allow-unauthenticated
      --set-env-vars="SDR_BOT_API_URL=${SDR_BOT_API_URL}"
      --set-secrets="TELEGRAM_BOT_TOKEN=telegram-bot-token:latest,TELEGRAM_WEBHOOK_SECRET=telegram-webhook-secret:latest"
  environment:
    name: production/telegram-service
  # needs sdr-bot-api (não build_and_push): a URL do sdr-bot-api é
  # descoberta dinamicamente via `gcloud run services describe`, mesmo
  # padrão que deploy_sdr_bot_api já usa pra descobrir litellm-proxy --
  # então este job só pode rodar depois que sdr-bot-api já existe como
  # serviço Cloud Run.
  needs: ["deploy_sdr_bot_api"]
  rules:
    - if: '$GCP_PROJECT_ID && $CI_COMMIT_BRANCH == "main"'
      when: manual

# registry.gitlab.com/security-products/container-scanning roda como
# uid 1000 não-root, sem curl/jq/wget e sem permissão de escrever em
# /var/lib/apt/lists -- não dá pra instalar NEM chamar nada ali dentro
# (confirmado: apt falha com "Permission denied", e nem curl nem jq
# existem de saída). Por isso o token é gerado num job separado, na
# imagem google/cloud-sdk:slim (que já tem gcloud funcionando, mesmo
# padrão dos outros jobs de deploy), e repassado via dotenv artifact --
# nenhuma ferramenta precisa ser instalada dentro da imagem do scanner.
container_scanning_auth:
  stage: deploy
  image: google/cloud-sdk:slim
  needs: ["build_and_push"]
  id_tokens:
    GCP_ID_TOKEN:
      aud: "https://iam.googleapis.com/projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL_ID}/providers/${WIF_PROVIDER_ID}"
  before_script:
    - *gcp_auth
  script:
    - echo "CS_REGISTRY_USER=oauth2accesstoken" > registry_auth.env
    - echo "CS_REGISTRY_PASSWORD=$(gcloud auth print-access-token)" >> registry_auth.env
  artifacts:
    reports:
      dotenv: registry_auth.env
  rules:
    - if: '$GCP_PROJECT_ID && $CI_COMMIT_BRANCH == "main"'

# O template (incluído no topo do arquivo) por padrão roda no stage
# "test" (antes de build_and_push existir) e não tem credencial nenhuma
# pro Artifact Registry, que é privado -- sem isso o job só falharia
# tentando puxar CS_IMAGE. CS_REGISTRY_USER/PASSWORD chegam prontos via
# dotenv do container_scanning_auth acima -- ver comentário lá do porquê
# o token não é gerado aqui dentro.
container_scanning:
  stage: deploy
  needs: ["build_and_push", "container_scanning_auth"]
  # Sem isso o job herda as rules default do template, que rodam na
  # branch padrão do repositório (develop, não main -- ver comentário no
  # topo deste arquivo) onde build_and_push nem existe no pipeline
  # (rules dele só casam com main), quebrando o "needs" acima com
  # "'container_scanning' job needs 'build_and_push' job, but
  # 'build_and_push' does not exist in the pipeline".
  rules:
    - if: '$GCP_PROJECT_ID && $CI_COMMIT_BRANCH == "main"'