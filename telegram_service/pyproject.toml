[project]
name = "telegram-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

# Sem [tool.pytest.ini_options] aqui de propósito: os testes deste
# serviço rodam a partir da raiz do repo, usando o venv/config do
# projeto principal (que já tem fastapi/httpx/pytest/pytest-asyncio e
# pythonpath=["."], o que torna `telegram_service` importável como
# pacote). Uma seção própria aqui sequestraria a descoberta de rootdir
# do pytest sempre que `telegram_service/tests/` for passado como
# argumento -- confirmado rodando de verdade: com essa seção presente,
# `uv run pytest telegram_service/tests/ -v` (da raiz) resolve rootdir
# pra telegram_service/ em vez da raiz do repo, e o import
# `from telegram_service.main import app` quebra com ModuleNotFoundError.
