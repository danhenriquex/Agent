# Migrado de .gitlab-ci.yml (GitLab CI) -- ver git log desse arquivo pra
# a versão anterior. Duas simplificações que vêm de graça no GitHub
# Actions, sem workaround nenhum:
#   - runners ubuntu-latest já vêm com docker + buildx instalados, então
#     nenhuma das ginásticas do GitLab (docker-cli separado, docker-buildx
#     separado, DOCKER_HOST/DOCKER_TLS_CERTDIR pro dind) é necessária.
#   - container scanning roda no MESMO job que builda/empurra a imagem,
#     não precisa de um job separado só pra gerar token e repassar via
#     dotenv (isso existia no GitLab só por causa da imagem não-root do
#     scanner gerenciado, que não tinha curl/jq).
#
# Aprovação manual pros jobs de deploy (equivalente ao `when: manual` do
# GitLab): configurada via GitHub Environments com "required reviewers"
# (Settings > Environments > production-*), não dá pra expressar isso só
# no YAML do workflow.

name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Computados uma vez, no nível do workflow -- mesmo padrão do
# .gitlab-ci.yml original (API_IMAGE_TAG/PROXY_IMAGE_TAG/TELEGRAM_IMAGE_TAG
# como `variables:` top-level). NÃO usar job `outputs:` pra isso: o GitHub
# Actions zera silenciosamente qualquer output que contenha um secret
# ("Skip output ... since it may contain secret"), o que gerava
# --image="" nos jobs de deploy. env vars comuns não têm essa restrição.
env:
  API_IMAGE_TAG: ${{ secrets.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPOSITORY }}/sdr-bot-api:${{ github.sha }}
  PROXY_IMAGE_TAG: ${{ secrets.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPOSITORY }}/litellm-proxy:${{ github.sha }}
  TELEGRAM_IMAGE_TAG: ${{ secrets.AR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPOSITORY }}/telegram-service:${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - run: uv run ruff check app tests

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - run: uv run pytest tests/ -v
      # Nota: os testes atuais (smoke test da topologia de agentes +
      # /health da API) não fazem nenhuma chamada real de LLM nem
      # precisam de OPENROUTER_API_KEY -- seguro rodar em qualquer PR,
      # inclusive de contribuidor externo.

  docker_build_check:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      # Roda SEMPRE, mesmo sem GCP configurado -- só valida que os
      # Dockerfiles buildam de verdade. Pega Dockerfile quebrado antes de
      # qualquer tentativa de deploy, sem precisar de nenhuma credencial
      # de nuvem.
      - run: docker build -t sdr-bot-api:ci-check .
      - run: docker build -t litellm-proxy:ci-check ./litellm_proxy
      - run: docker build -t telegram-service:ci-check ./telegram_service

  build_and_push:
    runs-on: ubuntu-latest
    needs: [docker_build_check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}"
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${{ secrets.AR_REGION }}-docker.pkg.dev" --quiet

      - run: docker build -t "$API_IMAGE_TAG" .
      - run: docker push "$API_IMAGE_TAG"
      - run: docker build -t "$PROXY_IMAGE_TAG" ./litellm_proxy
      - run: docker push "$PROXY_IMAGE_TAG"
      - run: docker build -t "$TELEGRAM_IMAGE_TAG" ./telegram_service
      - run: docker push "$TELEGRAM_IMAGE_TAG"

      # Container scanning: no mesmo job, direto na imagem que expõe mais
      # superfície de rede (sdr-bot-api) -- sem job separado pra gerar
      # token (a credencial WIF já autenticada acima já dá pull na
      # imagem que acabou de ser empurrada).
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE_TAG }}
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "0" # não quebra o pipeline -- mesmo comportamento do allow_failure:true do template GitLab

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
      # Secret scanning não precisa de job nenhum: é uma feature nativa
      # do repositório (Settings > Code security > Secret scanning),
      # equivalente ao template Secret-Detection do GitLab.

  deploy_litellm_proxy:
    runs-on: ubuntu-latest
    needs: [build_and_push]
    environment:
      name: production-litellm-proxy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}"
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # NOTA de segurança (deliberadamente simplificado nesta fase):
      # --allow-unauthenticated aqui porque a autenticação de fato é o
      # LITELLM_PROXY_KEY validado dentro da aplicação (general_settings.
      # master_key), não IAM do Cloud Run. O endurecimento correto é usar
      # --no-allow-unauthenticated + conceder roles/run.invoker só para a
      # service account do sdr-bot-api, com o cliente anexando um ID
      # token do Google na chamada -- isso fica como TODO de hardening.
      #
      # --memory=1Gi: o default do Cloud Run (512 MiB) não é suficiente
      # -- confirmado via logs na revision que falhou: "Memory limit of
      # 512 MiB exceeded with 519 MiB used", OOM antes de bindar a porta.
      - run: |
          gcloud run deploy litellm-proxy \
            --image="$PROXY_IMAGE_TAG" \
            --region="${{ secrets.GCP_REGION }}" \
            --platform=managed \
            --port=4000 \
            --memory=1Gi \
            --allow-unauthenticated \
            --set-secrets="OPENROUTER_API_KEY=openrouter-api-key:latest,LITELLM_PROXY_KEY=litellm-proxy-key:latest"

  # Sobe o Phoenix (tracing de agentes/RAG, ver app/agents/observability.py)
  # como serviço Cloud Run próprio, em vez de deixar como só-local
  # (make phoenix-up). Sem isso, cada `Runner.run()` do sdr-bot-api em
  # produção tenta exportar spans pra localhost:4317, que não existe
  # dentro do container -- silencioso (register() nunca propaga erro de
  # export), mas 100% dos traces de produção eram perdidos, e os logs
  # do Cloud Run ficavam poluídos com "Transient error ... retrying"
  # a cada requisição (confirmado via gcloud logging read).
  deploy_phoenix:
    runs-on: ubuntu-latest
    needs: [docker_build_check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-phoenix
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}"
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # Imagem pública oficial da Arize (não passa por build_and_push --
      # não é código nosso). Pinada numa tag real (verificada via Docker
      # Hub API, não "latest") pelo mesmo motivo do trivy-action: uma tag
      # móvel muda de baixo dos nossos pés sem aviso.
      #
      # --max-instances=1 é ESSENCIAL, não só custo: sem um Postgres
      # externo (decisão deliberada de manter simples nesta fase), o
      # Phoenix guarda os traces em storage local dentro do próprio
      # container. Com mais de uma instância, cada uma teria seu próprio
      # storage desconectado -- metade dos traces numa, metade na outra,
      # sem uma timeline completa em lugar nenhum. --min-instances=1
      # evita cold start E evita reciclagem por scale-to-zero, que
      # apagaria todo o histórico acumulado.
      #
      # PHOENIX_PORT=6006 explícito: é o mesmo valor default do pacote
      # (ver phoenix/config.py: PORT = 6006), mas o Cloud Run injeta sua
      # própria env var PORT (que o Phoenix ignora, ele só lê
      # PHOENIX_PORT) -- setar explícito evita depender de um default
      # implícito de uma lib de terceiro coincidir com --port abaixo.
      #
      # --allow-unauthenticated: mesmo racional (e mesmo TODO de
      # hardening) do litellm-proxy, só que mais sensível -- a UI do
      # Phoenix mostra o conteúdo completo das conversas, mesmo dado do
      # endpoint /handoff/.../history, que já é público hoje. Endurecer
      # os dois juntos é o próximo passo, não piora o que já existe.
      - run: |
          gcloud run deploy phoenix \
            --image="arizephoenix/phoenix:version-20.8.0" \
            --region="${{ secrets.GCP_REGION }}" \
            --platform=managed \
            --port=6006 \
            --memory=1Gi \
            --min-instances=1 \
            --max-instances=1 \
            --allow-unauthenticated \
            --set-env-vars="PHOENIX_PORT=6006"

  deploy_sdr_bot_api:
    runs-on: ubuntu-latest
    needs: [deploy_litellm_proxy, deploy_phoenix]
    environment:
      name: production-sdr-bot-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}"
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: proxy_url
        run: echo "url=$(gcloud run services describe litellm-proxy --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"
      # Mesmo padrão de descoberta dinâmica de URL do proxy_url acima --
      # não é secret (é só a URL pública do serviço), então não cai no
      # bug de "Skip output ... since it may contain secret" que afetou
      # API_IMAGE_TAG/etc (esses sim vêm de secrets.*).
      - id: phoenix_url
        run: echo "url=$(gcloud run services describe phoenix --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"
      # --memory=4Gi: 2Gi ainda não bastava -- confirmado via logs numa
      # invocação de agente real: "Memory limit of 2048 MiB exceeded with
      # 2196 MiB used" (depois de já termos subido de 512Mi -> 1Gi ->
      # 2Gi pelo mesmo motivo). App carrega ADK + guardrails + Presidio
      # (NER/PII) tudo num processo só -- uso varia bastante conforme o
      # que a conversa aciona, sem sinal de platô ainda visto até agora.
      #
      # PHOENIX_COLLECTOR_ENDPOINT: precisa do path /v1/traces (endpoint
      # OTLP/HTTP que o Phoenix expõe na MESMA porta 6006 da UI -- não
      # precisa do gRPC 4317, ver .env.example pro equivalente local).
      - run: |
          gcloud run deploy sdr-bot-api \
            --image="$API_IMAGE_TAG" \
            --region="${{ secrets.GCP_REGION }}" \
            --platform=managed \
            --port=8080 \
            --memory=4Gi \
            --allow-unauthenticated \
            --service-account="sdr-bot-api-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --add-cloudsql-instances="${{ secrets.CLOUD_SQL_CONNECTION_NAME }}" \
            --set-env-vars="LITELLM_PROXY_URL=${{ steps.proxy_url.outputs.url }},SDR_APP_NAME=sdr-bot,PHOENIX_COLLECTOR_ENDPOINT=${{ steps.phoenix_url.outputs.url }}/v1/traces" \
            --set-secrets="LITELLM_PROXY_KEY=litellm-proxy-key:latest,SESSION_DB_URL=session-db-url:latest"

  deploy_telegram_service:
    runs-on: ubuntu-latest
    # needs sdr-bot-api (não build_and_push diretamente): a URL do
    # sdr-bot-api é descoberta dinamicamente via `gcloud run services
    # describe`, mesmo padrão que deploy_sdr_bot_api já usa pra
    # descobrir litellm-proxy -- então este job só pode rodar depois que
    # sdr-bot-api já existe como serviço Cloud Run.
    needs: [deploy_sdr_bot_api]
    environment:
      name: production-telegram-service
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}"
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: sdr_bot_api_url
        run: echo "url=$(gcloud run services describe sdr-bot-api --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"
      # --memory=1Gi: mesmo problema visto em litellm-proxy e sdr-bot-api
      # (OOM no default de 512 MiB antes de bindar a porta).
      - run: |
          gcloud run deploy telegram-service \
            --image="$TELEGRAM_IMAGE_TAG" \
            --region="${{ secrets.GCP_REGION }}" \
            --platform=managed \
            --port=8200 \
            --memory=1Gi \
            --allow-unauthenticated \
            --set-env-vars="SDR_BOT_API_URL=${{ steps.sdr_bot_api_url.outputs.url }}" \
            --set-secrets="TELEGRAM_BOT_TOKEN=telegram-bot-token:latest,TELEGRAM_WEBHOOK_SECRET=telegram-webhook-secret:latest"
