[project]
name = "sdr-agent"
version = "0.1.0"
description = "SDR Bot multi-agente (Google ADK + LiteLLM/OpenRouter) — portfolio de engenharia de IA em produção"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.6.1",
    "deprecated",
    "litellm>=1.55.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "spacy>=3.8.0,<3.9.0",
    "pt-core-news-lg",
    "chromadb>=1.5.9",
    "sentence-transformers>=6.0.0",
    "dagster>=1.13.19",
    "fastmcp>=3.4.7",
    "dagster-webserver>=1.13.19",
    "openinference-instrumentation-google-adk>=0.1.20",
    "arize-phoenix>=20.3.0",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "torch>=2.13.0",
    "deprecated>=1.3.1",
    "langfuse>=4.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
]

# pt_core_news_lg não está no PyPI (modelos do spaCy são distribuídos como
# wheels diretas nos releases do GitHub) — apontamos a dependência acima
# para essa URL. Versão 3.8.0 é a compatível com spacy>=3.8,<3.9 conforme
# https://raw.githubusercontent.com/explosion/spacy-models/master/compatibility.json
#
# torch: sentence-transformers (Parte 4) traz torch como dependência
# transitiva. Por padrão, no Linux, PyPI resolve pro build com CUDA/NVIDIA
# embutido (~4.5GB extras: pacote nvidia sozinho é 2.7GB) -- não usamos
# GPU em lugar nenhum deste projeto (o modelo de embedding roda em CPU).
# Apontar torch pro índice CPU-only oficial do PyTorch evita esse peso
# inteiro sem trocar nenhuma funcionalidade. Descoberto de forma
# concreta: pipeline do GitLab CI ficando sem espaço em disco no
# `docker_build_check` (COPY do .venv), com .venv medindo 6.4GB local,
# 2.7GB só em nvidia/*.
[tool.uv.sources]
pt-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_lg-3.8.0/pt_core_news_lg-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Dependências de desenvolvimento/CI (PEP 735) — nunca instaladas na
# imagem de produção. Isso é o motivo real da migração: com
# requirements.txt, o Dockerfile instalava pytest dentro do container
# que vai pro Cloud Run. Com dependency-groups, `uv sync --no-dev` no
# build de produção simplesmente não inclui nada daqui.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
