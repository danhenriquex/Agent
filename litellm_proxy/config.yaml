# litellm_proxy/config.yaml
#
# Cada "model_name" abaixo é um ALIAS que os agentes do ADK referenciam
# (ex: LiteLlm(model="litellm_proxy/orchestrator-model")). O proxy resolve
# o alias pro modelo real na OpenRouter. Isso permite trocar o modelo por
# trás de um agente sem tocar no código do agente — só mexe aqui.
#
# Racional de qual modelo vai em cada papel está documentado na arquitetura
# (README.md) — resumo: tarefas de raciocínio/nuance usam modelo mais forte,
# tarefas estruturadas/roteamento usam modelo mais barato e rápido.
#
# NOTA: qualification/knowledge/objection-model apontavam originalmente
# pra anthropic/claude-3.5-sonnet — esse modelo foi oficialmente
# aposentado pela Anthropic em 5 de janeiro de 2026 e a OpenRouter parou
# de rotear pra ele ("No endpoints found"), o que quebrou os testes ao
# vivo (test_golden_conversations.py). Migrado pra anthropic/claude-
# sonnet-5 (sucessor direto na mesma faixa Sonnet, lançado 30/06/2026).
# Isso é um lembrete de que aliases de modelo em provedores terceiros
# precisam de manutenção periódica -- não é "configura uma vez e
# esquece".
#
# ATUALIZAÇÃO (custo): os três acima foram trocados de claude-sonnet-5
# pra gpt-4o-mini -- decisão explícita de custo (Sonnet 5 é ~10-15x
# mais caro por token, e dominava o gasto na OpenRouter mesmo sendo só
# 3 dos 7 aliases).
#
# REVERTIDO PARCIALMENTE (qualidade): knowledge-model saiu de
# gpt-4o-mini -- confirmado em produção real, ele narrava a intenção
# de usar a tool ("Realizando busca por funcionalidades do
# produto...") como se fosse a resposta final, em vez de chamar a tool
# e responder com o resultado, deixando o lead sem resposta de
# verdade. Não é bug nosso: disciplina de tool-use (decidir chamar uma
# tool SILENCIOSAMENTE vs. narrar a intenção em prosa) é justamente a
# capacidade que mais degrada em modelos menores -- e o prompt de
# knowledge_agent tem uma regra condicional de duas etapas ("NUNCA
# responda sem consultar a tool" + "se o resultado não cobrir, diga
# que vai confirmar com o time"), exatamente o tipo de contrato
# multi-passo onde um modelo mais fraco tende a atalhar. Em vez de
# voltar direto pra claude-sonnet-5 (10-15x mais caro), testamos
# claude-haiku-4.5 (bem mais barato que Sonnet, ainda Anthropic) via
# `make eval-run` ANTES de decidir -- diferente da troca original pra
# gpt-4o-mini, que foi direto pra produção sem esse passo. Resultado:
# 22 itens completados sem narrativa em vez de tool call, média
# combinada 4.49 contra baseline 4.576 (delta 0.086, dentro da
# tolerância de 0.4 de eval/regression.py) -- então knowledge-model
# ficou em claude-haiku-4.5, não claude-sonnet-5. qualification/
# objection-model continuam em gpt-4o-mini -- não mostraram esse
# sintoma (fluxos mais simples, sem esse mesmo contrato condicional de
# tool-use). Ainda fica como TODO rodar `make eval-run` focado neles
# pra confirmar com número, não só anedota, que qualification/
# objection realmente seguram a qualidade em gpt-4o-mini.
#
# Efeito colateral pro judge-model abaixo: a razão original de excluir
# gpt-4o-mini como juiz era evitar viés de auto-avaliação com
# orchestrator/scheduling/escalate-model -- agora qualification/
# objection-model TAMBÉM são gpt-4o-mini (5 dos 6 agentes avaliados),
# e o juiz (gpt-4o) é da MESMA família (GPT-4o). Mitigado pra
# knowledge-model (claude-haiku-4.5 não compartilha família com o
# juiz -- a dimensão de faithfulness mais sensível a alucinação fica
# livre desse viés), mas não resolvido pros outros 5 -- ver TODO no
# bloco do judge-model.

model_list:
  # --- Orquestrador: roteamento de intenção, não precisa de raciocínio pesado ---
  - model_name: orchestrator-model
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Qualificação: precisa conduzir perguntas de discovery coerentes ---
  # gpt-4o-mini por custo (ver NOTA de atualização acima) -- era
  # claude-sonnet-5.
  - model_name: qualification-model
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Knowledge/RAG: faithfulness importa, não pode alucinar sobre produto ---
  # Saiu de gpt-4o-mini (ver bloco REVERTIDO PARCIALMENTE acima) --
  # claude-haiku-4.5, não claude-sonnet-5: mais barato que Sonnet e
  # passou em `make eval-run` (4.49 vs baseline 4.576, dentro da
  # tolerância) sem repetir a narrativa de tool-call do gpt-4o-mini.
  - model_name: knowledge-model
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Objeções: nuance e persuasão ---
  # gpt-4o-mini por custo (ver NOTA de atualização acima) -- era
  # claude-sonnet-5.
  - model_name: objection-model
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Agendamento: tarefa estruturada (extrair data/hora), modelo barato ---
  - model_name: scheduling-model
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Escalonamento: resposta curta e padronizada ---
  - model_name: escalate-model
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  # Fallback global: se o modelo primário de qualquer alias falhar
  # (rate limit, indisponibilidade), tenta este antes de propagar o erro.
  - model_name: fallback-model
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-8b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Parte 6: modelo-juiz (LLM-as-judge) do golden eval set ---
  # HISTÓRICO (não mais totalmente válido, ver TODO abaixo):
  # DELIBERADAMENTE escolhido de uma família DIFERENTE dos avaliados
  # (na época, qualification/knowledge/objection-model, todos claude-
  # sonnet-5) -- um modelo julgando a própria família de saída como boa
  # é um viés de auto-avaliação documentado em LLM-as-judge. A primeira
  # escolha foi claude-opus-5 (mesma família Anthropic, uma classe de
  # raciocínio acima) -- trocado pra gpt-4o depois de rodar
  # `make eval-run` de verdade: Opus é bem mais caro/lento (pressão
  # real sobre o saldo da OpenRouter, que já bloqueou a run duas vezes
  # nesta parte) E era uma família totalmente diferente da Sonnet, com
  # reputação sólida de seguir formato JSON estrito -- relevante porque
  # eval/judge.py::parse_judge_response já teve falha de parsing num
  # item durante teste real. gpt-4o-mini (mais barato ainda) foi
  # descartado de propósito NA ÉPOCA: já era o modelo por trás de
  # orchestrator/scheduling/escalate-model, reintroduzindo viés de
  # auto-avaliação pra qualquer conversa que passe por eles.
  #
  # TODO (parcialmente quebrado pela troca de custo acima, e só
  # parcialmente corrigido pelo revert do knowledge-model): qualification/
  # objection-model continuam gpt-4o-mini -- ou seja, 5 dos 6 agentes
  # avaliados usam gpt-4o-mini, e o juiz (gpt-4o) é da MESMA família
  # (GPT-4o), o viés que esta escolha existia pra evitar. knowledge-model
  # foi pra claude-haiku-4.5 (fora da família do juiz), então a
  # dimensão mais sensível a alucinação (faithfulness sobre produto) já
  # não compartilha família com quem julga. Não resolvido pros outros
  # 5 -- se o viés de auto-avaliação importar de verdade pros seus
  # resultados, troque o judge-model pra algo fora da família GPT-4o
  # (ex: um Claude ou Llama maior) antes de confiar nos scores do
  # próximo `make eval-run`.
  - model_name: judge-model
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  # Cada alias acima cai neste fallback em caso de erro/rate-limit.
  fallbacks:
    - orchestrator-model: ["fallback-model"]
    - qualification-model: ["fallback-model"]
    - knowledge-model: ["fallback-model"]
    - objection-model: ["fallback-model"]
    - scheduling-model: ["fallback-model"]
    - escalate-model: ["fallback-model"]
    - judge-model: ["fallback-model"]

  # Parte 5: langfuse_otel é o callback de PRIMEIRA CLASSE atual pra
  # LangFuse via LiteLLM Proxy -- a alternativa mais simples
  # (success_callback: ["langfuse"]) é a integração "legacy v2 SDK",
  # explicitamente não recomendada pelo próprio LiteLLM pra LangFuse
  # v3+ (o que rodamos, self-hospedado, ver langfuse/docker-compose.yml).
  # langfuse_otel constrói o endpoint OTLP e a autenticação (Basic
  # Auth com as chaves abaixo) automaticamente -- não precisa configurar
  # OTEL_EXPORTER_OTLP_* manualmente.
  callbacks: ["langfuse_otel"]

general_settings:
  master_key: os.environ/LITELLM_PROXY_KEY
